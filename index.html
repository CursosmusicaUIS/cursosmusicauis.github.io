<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursos Música UIS · Revisión de Proceso 2026-1</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #ffffff;
    --off-white: #f4f8f4;
    --dark-green: #1b4332;
    --mid-green: #2d6a4f;
    --light-green: #74c69d;
    --pale-green: #d8f3dc;
    --text: #1b3a2d;
    --muted: #5a8a72;
    --border: #b7e4c7;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text); min-height: 100vh; }

  .header { background: var(--dark-green); position: relative; overflow: hidden; }
  .header-inner { max-width: 900px; margin: 0 auto; padding: 36px 24px 32px; position: relative; z-index: 1; display: flex; align-items: center; gap: 20px; }
  .header-logo { width: 72px; height: 72px; border-radius: 16px; flex-shrink: 0; box-shadow: 0 4px 20px rgba(0,0,0,0.25); object-fit: cover; }
  .header-text {}
  .header-badge { display: inline-block; background: var(--light-green); color: var(--dark-green); font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; margin-bottom: 6px; }
  .header h1 { font-family: 'Playfair Display', serif; font-size: clamp(22px,4vw,38px); font-weight: 900; line-height: 1.1; color: #fff; }
  .header h1 span { color: var(--light-green); }
  .header p { font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 4px; }
  .header-deco { position: absolute; right: -60px; top: -60px; width: 280px; height: 280px; border-radius: 50%; border: 50px solid rgba(116,198,157,0.08); pointer-events: none; }
  .header-deco2 { position: absolute; right: 80px; bottom: -80px; width: 180px; height: 180px; border-radius: 50%; border: 35px solid rgba(116,198,157,0.06); pointer-events: none; }

  .main { max-width: 900px; margin: 0 auto; padding: 44px 24px 80px; }

  .login-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 20px; padding: 44px 36px; max-width: 460px; margin: 0 auto; box-shadow: 0 4px 40px rgba(27,67,50,0.08); animation: fadeUp 0.5s ease; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

  .login-logo-wrap { display: flex; justify-content: center; margin-bottom: 20px; }
  .login-logo { width: 80px; height: 80px; border-radius: 18px; object-fit: cover; box-shadow: 0 4px 16px rgba(27,67,50,0.15); }

  .login-card h2 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; margin-bottom: 6px; color: var(--dark-green); text-align: center; }
  .login-card .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; line-height: 1.6; text-align: center; }
  .field-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .field-input { width: 100%; padding: 14px 18px; font-size: 20px; font-family: 'DM Sans', sans-serif; font-weight: 500; background: var(--off-white); border: 2px solid var(--border); border-radius: 12px; color: var(--dark-green); outline: none; transition: border-color 0.2s, box-shadow 0.2s; letter-spacing: 3px; }
  .field-input:focus { border-color: var(--mid-green); box-shadow: 0 0 0 4px rgba(82,183,136,0.15); background: #fff; }
  .btn-primary { display: block; width: 100%; margin-top: 18px; padding: 16px; background: var(--dark-green); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; border: none; border-radius: 12px; cursor: pointer; transition: background 0.2s, transform 0.1s, box-shadow 0.2s; }
  .btn-primary:hover { background: var(--mid-green); box-shadow: 0 4px 16px rgba(27,67,50,0.2); }
  .btn-primary:active { transform: scale(0.98); }
  .error-msg { display: none; margin-top: 14px; padding: 12px 16px; background: #fff5f5; border: 1px solid #fecaca; border-radius: 10px; color: #b91c1c; font-size: 13px; font-weight: 500; }

  .result-card { display: none; animation: fadeUp 0.5s ease; }

  .student-header { background: var(--dark-green); border-radius: 20px 20px 0 0; padding: 32px 36px; color: #fff; position: relative; overflow: hidden; }
  .student-header::before { content:''; position:absolute; right:-40px; top:-40px; width:200px; height:200px; border-radius:50%; background:rgba(116,198,157,0.1); pointer-events:none; }
  .student-tag { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--light-green); margin-bottom: 8px; display: block; }
  .student-name { font-family: 'Playfair Display', serif; font-size: clamp(20px,4vw,32px); font-weight: 700; line-height: 1.2; margin-bottom: 16px; position: relative; z-index: 1; }
  .student-meta { display: flex; flex-wrap: wrap; gap: 8px; position: relative; z-index: 1; }
  .meta-pill { background: rgba(116,198,157,0.15); border: 1px solid rgba(116,198,157,0.3); color: rgba(255,255,255,0.9); padding: 4px 12px; border-radius: 20px; font-size: 12px; }

  .result-body { background: var(--card); border: 1.5px solid var(--border); border-top: none; border-radius: 0 0 20px 20px; padding: 32px 36px; box-shadow: 0 8px 40px rgba(27,67,50,0.08); }

  .obs-section-title { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--pale-green); }
  .obs-block { background: var(--off-white); border: 1.5px solid var(--border); border-radius: 14px; padding: 20px 22px; margin-bottom: 12px; transition: box-shadow 0.2s; }
  .obs-block:hover { box-shadow: 0 4px 20px rgba(27,67,50,0.08); }
  .obs-block:last-child { margin-bottom: 0; }
  .obs-revision-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--mid-green); background: var(--pale-green); padding: 3px 10px; border-radius: 20px; margin-bottom: 6px; }
  .obs-clase { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--dark-green); background: rgba(27,67,50,0.07); border: 1px solid rgba(27,67,50,0.12); padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; margin-left: 6px; }
  .obs-date { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .obs-text { font-size: 14px; line-height: 1.78; color: var(--text); white-space: pre-line; }
  .obs-pct-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1.5px solid var(--border); }
  .obs-pct-label { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .obs-pct-bar-bg { flex: 1; background: rgba(27,67,50,0.1); border-radius: 4px; height: 6px; overflow: hidden; }
  .obs-pct-bar-fill { height: 100%; border-radius: 4px; }
  .obs-pct-num { font-size: 13px; font-weight: 700; min-width: 38px; text-align: right; }
  .obs-profesor { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: right; font-style: italic; }

  .btn-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; background: none; border: none; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; letter-spacing: 0.5px; text-transform: uppercase; padding: 0; transition: color 0.2s; }
  .btn-back:hover { color: var(--dark-green); }

  .footer { text-align: center; padding: 28px 24px; color: var(--muted); font-size: 12px; border-top: 1.5px solid var(--border); background: var(--white); }

  @media (max-width: 600px) {
    .login-card { padding: 32px 20px; }
    .student-header { padding: 24px 20px; }
    .result-body { padding: 20px; }
    .header-inner { padding: 24px 20px; gap: 14px; }
    .header-logo { width: 56px; height: 56px; }
  }
</style>
</head>

, "1096209264": {"nombre": "Alejandro Sarmiento G\u00f3mez", "programa": "Preuniversitario", "instrumento": "Instrumento", "profesor": "Josmel Flores", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "El estudiante ha mostrado un progreso muy positivo en su proceso con el instrumento. Se evidencia un buen compromiso y avances en su desempe\u00f1o general, especialmente en la ejecuci\u00f3n b\u00e1sica del instrumento. Sin embargo, es importante que dedique un poco m\u00e1s de tiempo al estudio individual para fortalecer aspectos t\u00e9cnicos como la articulaci\u00f3n y la flexibilidad, fundamentales para un mejor control del sonido y la precisi\u00f3n. Con mayor constancia en la pr\u00e1ctica, podr\u00e1 seguir mejorando de manera notable. En general, su proceso va muy bien.", "porcentaje": 85.0, "clase": "Instrumento", "profesor": "Josmel Flores"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Audici\u00f3n: presenta un buen desarrollo en la habilidad auditiva para reconocer tensiones  y reposos en la armon\u00eda. Identifica correctamente de forma auditiva celulas r\u00edtmicas elementales presentando dificultad para reconocer patrones con figuras combinadas.\nSolfeo: presenta una notable dificultad para afinar la voz y realizar los ejercicios de solfeo entonado. El solfeo r\u00edtmico lo tiene bien integrado y lo resuelve correctamente descifrando patrones r\u00edtmicos simples y combinados", "porcentaje": 60.0, "clase": "Teor\u00eda y Solfeo", "profesor": "Nicol\u00e1s Navarro"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Integra correctamente la mayor\u00eda de los contenidos abordados en la asignatura\npresenta una gran debilidad con la lectura en doble clave.\nComprende las estructuras y relaciones jerarquicas naturales de la tonalidad, presentando dificultad o confusi\u00f3n en algunos conceptos elementales de la teor\u00eda musical(definiciones).", "porcentaje": 70.0, "clase": "Teoria M\u00fasical", "profesor": "Nicol\u00e1s Navarro"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Alejandro destaca por ser un guitarrista muy musical, caracterizado por un excelente sentido r\u00edtmico-mel\u00f3dico y una notable capacidad auditiva. Ha demostrado un compromiso cumpliendo de manera \u00f3ptima con el repertorio y los ejercicios propuestos. En el tromb\u00f3n tambi\u00e9n lo hace bien pero con ese instrumento apenas est\u00e1 iniciando. Mi recomendaci\u00f3n para \u00e9l es que se consagre como guitarrista.", "porcentaje": 100.0, "clase": "Ensamble Musical", "profesor": "Santiago Sguerra"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Alcances:\n-Mantiene ritmos constantes \n-Afinaci\u00f3n estable en los ejercicios mel\u00f3dicos \n\nAspectos a mejorar:\n-Polirritmia\n-Anacruzas\n-Sincopas \n-Entonaci\u00f3n con passaggios acordes a su tesitura \n-Direcci\u00f3n de los ejercicios r\u00edtmicos y mel\u00f3dicos \n-Identificaci\u00f3n de intervalos", "porcentaje": 50.0, "clase": "Coro", "profesor": "G\u00e9nesis Moreno"}], "nombre_oficial": "Alejandro Sarmiento G\u00f3mez", "instrumento_matriculado": "TROMPETA", "programa_matriculado": "Preuniversitario en m\u00fasica (14 a\u00f1os en adelante)"}, "1095304287": {"nombre": "Yaidy Katherin Calder\u00f3n Tarazona", "programa": "Preuniversitario", "instrumento": "Instrumento", "profesor": "Nicol\u00e1s Navarro", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Estudio t\u00e9cnico: completo al 21 de abril, e inicio de sonatina en C clementi\nbuen desarrollo del proceso t\u00e9cnico y mecanico en la practica instrumental, aun presenta debilidades en falanges distales del 4 y 5.\npresenta mejor\u00eda en la habilidad de lectura en doble clave, con dificultad para ubicar sobre el teclado las alturas del pentagrama\nmejora la postura y ergonom\u00eda en la pr\u00e1ctica articulando correctamente la cadena cinetica\ndebe reforzar la pr\u00e1ctica diaria para acelerar el proceso de montaje de las piezas", "porcentaje": 50.0, "clase": "Instrumento", "profesor": "Nicol\u00e1s Navarro"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Audici\u00f3n: presenta un buen desarrollo en la habilidad auditiva para reconocer tensiones  y reposos en la armon\u00eda. Identifica correctamente de forma auditiva celulas r\u00edtmicas elementales presentando dificultad para reconocer patrones con figuras combinadas.\nSolfeo: presenta un buen desarrollo en la afinacion de la voz y realiza los ejercicios de solfeo entonado por lectura e imitaci\u00f3n correctamente. comprende e imita estructuras ritmicas simples presentando dificultades para reconocer celulas r\u00edtmicas combinadas", "porcentaje": 60.0, "clase": "Teor\u00eda y Solfeo", "profesor": "Nicol\u00e1s Navarro"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Integra correctamente la mayor\u00eda de los contenidos abordados en la asignatura\npresenta una gran debilidad con la lectura en doble clave.\nComprende las estructuras y relaciones jerarquicas naturales de la tonalidad, presentando dificultad o confusi\u00f3n en algunos conceptos elementales de la teor\u00eda musical(definiciones).", "porcentaje": 70.0, "clase": "Teoria M\u00fasical", "profesor": "Nicol\u00e1s Navarro"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Yaidy destaca por ser una pianista y cantante muy musical, caracterizada por un excelente sentido r\u00edtmico-mel\u00f3dico y una notable capacidad auditiva. Ha demostrado un compromiso cumpliendo de manera \u00f3ptima con el repertorio y los ejercicios propuestos.", "porcentaje": 100.0, "clase": "Ensamble Musical", "profesor": "Santiago Sguerra"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Alcances:\n-Mantiene ritmos constantes \n-Afinaci\u00f3n estable en los ejercicios mel\u00f3dicos \n-Entona f\u00e1cilmente con passaggios acordes a su tesitura \n-Direcci\u00f3n de los ejercicios r\u00edtmicos y mel\u00f3dicos \n\nAspectos a mejorar:\n-Identificaci\u00f3n de intervalos\n-Polirritmia\n-Anacruzas\n-Sincopas", "porcentaje": 50.0, "clase": "Coro", "profesor": "G\u00e9nesis Moreno"}], "nombre_oficial": "Yaidy Katherin Calder\u00f3n Tarazona", "instrumento_matriculado": "PIANO", "programa_matriculado": "Preuniversitario en m\u00fasica (14 a\u00f1os en adelante)"}, "1101260937": {"nombre": "TOM\u00c1S ANDR\u00c9S M\u00c9NDEZ FERREIRA", "programa": "Preuniversitario", "instrumento": "Instrumento", "profesor": "Nicol\u00e1s Navarro", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Estudio t\u00e9cnico czerny: completado\nInvencion 8 Bach: manos separadas memorizadas, falta ensamblar manos juntas\nNotable mejora en el desarrollo de la ubicaci\u00f3n espacial a trav\u00e9s del fortalecimiendo de la propiocepci\u00f3n.\nnotable mejora en el desarrollo auditivo a traves del fortalecimiento y discriminaci\u00f3n estructural de las piezas en forma, frase y armon\u00eda.\nBuen desarrollo del proceso t\u00e9cnico y mec\u00e1nico en la pr\u00e1ctica instrumental, resuelve debilidades en falanges distales y ergonom\u00eda de la mu\u00f1eca y antebrazo.", "porcentaje": 70.0, "clase": "Instrumento", "profesor": "Nicol\u00e1s Navarro"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Audici\u00f3n: evidencia un desarrollo notable en la habilidad auditiva para reconocer tensiones y reposos en la armon\u00eda. identifica correctamente de forma auditiva celulas r\u00edtmicas simples y combinadas, sin presentar mayor dificultad para replicar y descifrar ejercicios auditivamente.\n\nSolfeo: presenta un desarrollo de la entonacion y afinaci\u00f3n correcto, no tiene mayores dificultades para imitar patrones mel\u00f3dicos y descifrar movimientos interv\u00e1licos en los ejercicios, comprende e imita ritmicamente estructuras simples, presentando algunas dificultades para reconocer celulas ritmicas combinadas.", "porcentaje": 70.0, "clase": "Teor\u00eda y Solfeo", "profesor": "Nicol\u00e1s Navarro"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Tom\u00e1s destaca por ser un pianista muy musical, caracterizado por un excelente sentido r\u00edtmico-mel\u00f3dico, una notable capacidad auditiva y una capacidad de improvisar excelente. Ha demostrado un compromiso cumpliendo de manera \u00f3ptima con el repertorio y los ejercicios propuestos.", "porcentaje": 100.0, "clase": "Ensamble Musical", "profesor": "Santiago Sguerra"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Alcances:\n-Mantiene ritmos constantes \n-Afinaci\u00f3n estable en los ejercicios mel\u00f3dicos \n-Direcci\u00f3n de los ejercicios r\u00edtmicos y mel\u00f3dicos \n-Identificaci\u00f3n de intervalos\n\nAspectos a mejorar:\n-Polirritmia\n-Anacruzas\n-Sincopas \n-Entonaci\u00f3n con passaggios acordes a su tesitura", "porcentaje": 50.0, "clase": "Coro", "profesor": "G\u00e9nesis Moreno"}], "nombre_oficial": "TOM\u00c1S ANDR\u00c9S M\u00c9NDEZ FERREIRA", "instrumento_matriculado": "PIANO", "programa_matriculado": "Preuniversitario en m\u00fasica (14 a\u00f1os en adelante)"}, "1029649105": {"nombre": "Juan Jos\u00e9 Hincapi\u00e9 Correa", "programa": "Preuniversitario", "instrumento": "Instrumento", "profesor": "Nicol\u00e1s Navarro", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Audici\u00f3n: presenta un buen desarrollo en la habilidad auditiva para reconocer tensiones  y reposos en la armon\u00eda. Identifica correctamente de forma auditiva celulas r\u00edtmicas elementales presentando dificultad para reconocer patrones con figuras combinadas.\nSolfeo: presenta una notable dificultad para afinar la voz y realizar los ejercicios de solfeo entonado. El solfeo r\u00edtmico lo tiene bien integrado y lo resuelve correctamente.", "porcentaje": 60.0, "clase": "Teor\u00eda y Solfeo", "profesor": "Nicol\u00e1s Navarro"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Integra correctamente la mayor\u00eda de los contenidos abordados en la asignatura\npresenta una gran debilidad con la lectura en doble clave.\nComprende las estructuras y relaciones jerarquicas naturales de la tonalidad, presentando dificultad o confusi\u00f3n en algunos conceptos elementales de la teor\u00eda musical(definiciones).", "porcentaje": 70.0, "clase": "Teoria M\u00fasical", "profesor": "Nicol\u00e1s Navarro"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Juan destaca por ser un guitarrista muy musical, caracterizado por un excelente sentido r\u00edtmico-mel\u00f3dico y una notable capacidad auditiva. Ha demostrado un compromiso cumpliendo de manera \u00f3ptima con el repertorio y los ejercicios propuestos.", "porcentaje": 100.0, "clase": "Ensamble Musical", "profesor": "Santiago Sguerra"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Alcances:\n-Mantiene ritmos constantes \n-Afinaci\u00f3n estable en los ejercicios mel\u00f3dicos \n-Entona f\u00e1cilmente con passaggios acordes a su tesitura \n-Direcci\u00f3n de los ejercicios r\u00edtmicos y mel\u00f3dicos \n\nAspectos a mejorar:\n-Identificaci\u00f3n de intervalos\n-Polirritmia\n-Anacruzas\n-Sincopas", "porcentaje": 50.0, "clase": "Coro", "profesor": "G\u00e9nesis Moreno"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "El estudiante es una persona constante y dedicada. Siempre llega a clase con una actitud positiva y participa activamente en las din\u00e1micas. Cumple con todas las tareas a tiempo, mostrando un gran inter\u00e9s por aprender. Su estabilidad se refleja en su organizaci\u00f3n y en la calidad de su trabajo, convirti\u00e9ndolo en un ejemplo para sus compa\u00f1eros.", "porcentaje": 90.0, "clase": "Instrumento", "profesor": "Ricardo Fortunato"}], "nombre_oficial": "Juan Jos\u00e9 Hincapi\u00e9 Correa", "instrumento_matriculado": "GUITARRA ACUSTICA", "programa_matriculado": "Preuniversitario en m\u00fasica (14 a\u00f1os en adelante)"}, "1097131386": {"nombre": "Sara Sofia Benavides camargo", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Nicol\u00e1s Navarro", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Up theme: debe memorizar la mano izquierda de la pieza para empezar a ensamblar. \nDebe reforzar su estudio entre semana para favorecer el avance del proceso", "porcentaje": 50.0, "clase": "Instrumento - Grupo A", "profesor": "Nicol\u00e1s Navarro"}], "nombre_oficial": "Sara Sofia Benavides camargo", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1099427512": {"nombre": "Mar\u00eda Jos\u00e9 Jimenez Parra", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Nicol\u00e1s Navarro", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Sonatina en C clementi: lleva un proceso adecuado y disciplinado. \nPresenta avances positivos en el desarrollo de la pieza, la cual est\u00e1 a punto de terminar.\nDebe reforzar el estudio de la pieza con metr\u00f3nomo, y ejecutarla mas despacio.", "porcentaje": 80.0, "clase": "Instrumento - Grupo A", "profesor": "Nicol\u00e1s Navarro"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "Demuestra una adecuada capacidad para entonar y seguir el ritmo, manteniendo estabilidad en su desempe\u00f1o vocal. Se integra de manera efectiva al trabajo grupal, evidenciando disposici\u00f3n para escuchar y aportar al ensamble.\n\nAsimismo, logra solfear la melod\u00eda y posteriormente interpretarla c aciones! Los avances del proceso son satisfactorios, se recomienda practicar lo visto en clase durante la semana y as\u00ed seguir aprovechando ese talento musical. Contin\u00faa as\u00ed \ud83d\ude0a.", "porcentaje": 68.0, "clase": "Instrumento - Grupo B", "profesor": "Maria Camila Arellano"}], "nombre_oficial": "Santiago Mart\u00ed Rodriguez", "instrumento_matriculado": "GUITARRA ACUSTICA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1098075410": {"nombre": "Jer\u00f3nimo Franco Silva", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Camilo Dur\u00e1n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Participa de manera activa y constante en la clase, proponiendo ideas y resoluciones de ejercicios que facilitan la comprensi\u00f3n del tema a sus compa\u00f1eros. Comprende el ritmo propuesto para el montaje de la canci\u00f3n y realiza un correcto cambio de acordes en la misma.\nSe recomienda el control y la atenci\u00f3n en clase, ya que en algunas ocasiones ha sido constante el di\u00e1logo con los compa\u00f1eros en momentos de la clase.", "porcentaje": 51.0, "clase": "Auralidad - Grupo B", "profesor": "Camilo Dur\u00e1n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "\u00a1Felicitaciones! Los avances del proceso son satisfactorios, se recomienda seguir practicando lo visto en clase durante la semana para as\u00ed seguir aprovechando ese talento musical. Vas por buen camino \ud83d\ude0a.", "porcentaje": 75.0, "clase": "Instrumento - Grupo B", "profesor": "Maria Camila Arellano"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "", "porcentaje": 100.0, "clase": "CORO - Juvenil", "profesor": "Daniela Visbal"}], "nombre_oficial": "Jer\u00f3nimo Franco Silva", "instrumento_matriculado": "GUITARRA ACUSTICA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1142718165": {"nombre": "Mar\u00eda Jos\u00e9 Ardila Correa", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Camilo Dur\u00e1n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Comprende el uso de las partes de una partitura, entiende y construye acordes mayores y menores en base a su estructura por tonos y semitonos. En el \u00e1rea instrumental, avanza en mantener un ritmo constante para el montaje de la canci\u00f3n, buscando estrategias que le faciliten la comprensi\u00f3n del ritmo y la independencia corporal.\nSe recomienda el control y la atenci\u00f3n en clase, ya que en algunas ocasiones ha sido constante el di\u00e1logo con los compa\u00f1eros en momentos de la clase.", "porcentaje": 50.0, "clase": "Auralidad - Grupo B", "profesor": "Camilo Dur\u00e1n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "Ah ejecutado los ritmos, fills y ejercicios de manos correctamente. Seguir practicando en casa y aumentando la velocidad gradualmente.", "porcentaje": 65.0, "clase": "Instrumento - Grupo B", "profesor": "Alejandro Vergel"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "", "porcentaje": 100.0, "clase": "CORO - Juvenil", "profesor": "Daniela Visbal"}], "nombre_oficial": "Mar\u00eda Jos\u00e9 Ardila Correa", "instrumento_matriculado": "BATERIA", "programa_matriculado": "Instrumental Semi personalizado del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1097113203": {"nombre": "Andrea Camila Gomez Torres", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Camilo Dur\u00e1n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Propone ideas para el desarrollo de las actividades en clase y hace buen uso del instrumento en el trabajo colectivo. E bilidades musicales, se recomienda apoyar en la construcci\u00f3n de disciplina en su estudio.", "porcentaje": 40.0, "clase": "Auralidad - Grupo B", "profesor": "Andr\u00e9s Prada"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "Demuestra una adecuada capacidad para entonar y seguir el ritmo, manteniendo estabilidad en su desempe\u00f1o vocal. Se integra de manera efectiva al trabajo grupal, evidenciando disposici\u00f3n para escuchar y aportar al ensamble.\n\nAsimismo, logra solfear la melod\u00eda y posteriormente interpretarla con la letra, lo que refleja comprensi\u00f3n tanto musical como expresiva.\n\nSe destaca su compromiso y participaci\u00f3n en clase. Contin\u00faa as\u00ed, y puedes seguir fortaleciendo la proyecci\u00f3n de la voz y la seguridad esc\u00e9nica para alcanzar un resultado a\u00fan m\u00e1s s\u00f3lido.", "porcentaje": 100.0, "clase": "CORO - Prejuvenil", "profesor": "Daniela Visbal"}], "nombre_oficial": "thomas emiliano casta\u00f1eda castillo", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1016972012": {"nombre": "Joaqu\u00edn Garc\u00eda S\u00e1nchez", "programa": "Preiniciaci\u00f3n", "instrumento": "nan", "profesor": "Laura G\u00f3mez", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "En ocasiones, ha mostrado una actitud dif\u00edcil, lo cual afecta su participaci\u00f3n en clase, seguimiento de instrucciones y comportamiento en general. Sin embargo, cuando su actitud es positiva, se observa un avance en los contenidos. Este cambio mejora su participaci\u00f3n, seguimiento y comportamiento, lo cual le ha permitido lograr varios de los objetivos de los contenidos.", "porcentaje": 70.0, "clase": "Ensamble Musical", "profesor": "Laura G\u00f3mez"}], "nombre_oficial": "Joaqu\u00edn Garc\u00eda S\u00e1nchez", "instrumento_matriculado": "", "programa_m icial": "Paulina Solano Jaimes", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1097140370": {"nombre": "NATALIA GUAYACAN ARIAS", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "G\u00e9nesis Moreno", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Alcances:\n- Lectura de partitura en clave de sol \n- Acordes del joropo (Am, Dm y E)\n- Facilidad de mantener ritmo constante\n-Cambios r\u00e1pidos de cada acorde manteniendo el comp\u00e1s de 6/8\n-Realiza anacruzas con facilidad \n\nAspectos a mejorar:\n- Lectura de partituras en clave de fa\n- Digitaci\u00f3n de la obra solista", "porcentaje": 50.0, "clase": "Instrumento - Grupo A", "profesor": "G\u00e9nesis Moreno"}], "nombre_oficial": "NATALIA GUAYACAN ARIAS", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1095960873": {"nombre": "Samuel Duarte Rojas", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "G\u00e9nesis Moreno", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Alcances:\n- Lectura de partitura en clave de sol \n- Facilidad de mantener ritmo constante\n-Digitaci\u00f3n correcta de la obra solista \n\nAspectos a mejorar:\n- Lectura de partituras en clave de fa\n- Cambio de bajos a tempo y con mayor agilidad en la obra com\u00fan", "porcentaje": 40.0, "clase": "Instrumento - Grupo A", "profesor": "G\u00e9nesis Moreno"}], "nombre_oficial": "Samuel Duarte Rojas", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1096074292": {"nombre": "ANLY ISABELLA VILLAMIZAR DELGADO", "programa": "Instrumental", "instrumento": "Instrumen onoce las notas en el pentagrama en clave de sol y clave de fa, no suele estudiar en casa la canci\u00f3n del grupo pero en clase resuelve bien, se le recomienda escuchar mucho la canci\u00f3n del grupo \"Mais que nada - Sergio Mendes\",  estudiar un poco m\u00e1s en casa y as\u00ed lograr avances m\u00e1s pronto, y llegar temprano a clase. Tiene mucho potencial, y cada clase logra muy buenos avances.", "porcentaje": 90.0, "clase": "Auralidad - Grupo B", "profesor": "Jas\u00f3n Pinz\u00f3n"}], "nombre_oficial": "Juan Manuel Ardila Correa", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Semi personalizado del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1097145767": {"nombre": "Juan Andr\u00e9s Medina Barrera", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Maria Camila Arellano", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Se destaca por su entusiasmo y energ\u00eda durante las actividades, sin embargo, en algunos momentos se distrae, lo que dificulta el avance del proceso. Se recomienda mantener la atenci\u00f3n un poco m\u00e1s y praticar en casa para tener un mejor resultado de ese gran talento musical. \u00a1Muy bien! \ud83d\ude0a.", "porcentaje": 65.0, "clase": "Instrumento - Grupo B", "profesor": "Maria Camila Arellano"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Estudiante que ya entiende conceptos b\u00e1sicos r\u00edtmicos y mel\u00f3dicos, reconoce las notas del pentagrama en clave de Sol y Fa, a\u00fan trabajando con \u00e9l cosas de disciplina y actitud en clase, suele pedir muchos permisos para ir al ba\u00f1o, esto suele ser porque se aburre o no quiere estar por momentos en clase, cosas que son normales en los ni\u00f1os de su edad. recomendaci\u00f3n escuchar mucho la canci\u00f3n del grupo \"Mais que nada - Sergio Mendes\". Tiene mucho potencial, y cada clase logra muy buenos avances.", "porcentaje": 80.0, "clase": "Auralidad - Grupo B", "profesor": "Jas\u00f3n Pinz\u00f3n"}], "nombre_oficial": "Juan Andr\u00e9s Medina Barrera", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Semi personalizado del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1098828403": {"nombre": "CATALINA MANTILLA GOMEZ", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Maria Camila Arellano", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "\u00a1Felicitaciones! Los avances del proceso son satisfactorios, se recomienda practicar lo visto en clase durante la semana. Contin\u00faa as\u00ed \ud83d\ude0a.", "porcentaje": 70.0, "clase": "Instrumento - Grupo B", "profesor": "Maria Camila Arellano"}], "nombre_oficial": "CATALINA MANTILLA GOMEZ", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Semi personalizado del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1014747797": {"nombre": "Ariana Gabriela Barrera Jaimes", "programa": "Iniciaci\u00f3n", "instrumento": "nan", "profesor": "G\u00e9nesis Moreno", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Alcances:\n- Escala de do mayor ascendente \n-Entonaci\u00f3n correcta de los grados de la escala\n-Reconocimiento de las figuras musicales (redonda, blanca, negra)\n-Aprendizaje del coro de la canci\u00f3n \u201cFiguras de la m\u00fasica\u201d y \u201cLa casita de las notas\u201d\n\nAspectos a mejorar:\n-Reconocimiento de las figuras musicales (corchea, semicorchea, fusa y semifusa)\n-Estrofa de la canci\u00f3n \u201cFiguras de la m\u00fasica\u201d\n-Escala de do mayor descendente", "porcentaje": 40.0, "clase": "Coro", "profesor": "G\u00e9nesis Moreno"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "El estudiante es una persona constante y dedicada. Siempre llega a clase con una actitud positiva y participa activamente en las din\u00e1micas. Cumple con todas las tareas a tiempo, mostrando un gran inter\u00e9s por aprender. Su estabilidad se refleja en su organizaci\u00f3n y en la calidad de su trabajo, convirti\u00e9ndolo en un ejemplo para sus compa\u00f1eros.", "porcentaje": 90.0, "clase": "Expresi\u00f3n Corporal", "profesor": "Ricardo Fortunato"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "La ni\u00f1a ha avanzado satisfactoriamente con el desarrollo del curso", "porcentaje": 100.0, "clase": "Exploraci\u00f3n Musical", "profesor": "Mariana Pinto"}], "nombre_oficial": "Ariana Gabriela Barrera Jaimes", "instrumento_matriculado": "", "programa_matriculado": "Iniciaci\u00f3n musical I y II ( 4 - 6 a\u00f1os)"}, "79052224": {"nombre": "Oscar Armando Ruiz Castro", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Maria Camila Arellano", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Los avances del proceso son satisfactorios, se recomienda seguir con la motivaci\u00f3n y las pr\u00e1cticas en casa para continuar mejorando las habilidades en el instrumento. \u00a1Felicitaciones! \ud83d\ude0a.", "porcentaje": 70.0, "clase": "Instrumento - Grupo A", "profesor": "Maria Camila Arellano"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Reconoce las notas en clave de Sol y Fa, tiene muy buena musicalidad al igual que buen ritmo y sentido de la pulsaci\u00f3n, reconoce las notas en su instrumento y pone su creatividad a prueba con facilidad al crear melod\u00edas.", "porcentaje": 85.0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}], "nombre_oficial": "Oscar Armando Ruiz Castro", "instrumento_matriculado": "FLAUTA TRAVERSA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1097502012": {"nombre": "CRISTIAN ANDRES RODRIGUEZ BURBANO", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Maria Camila Arellano", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Se destaca por su entusiasmo y energ\u00eda durante la clase, sin embargo, se distrae con facilidad, lo que dificulta el avance del proceso. Se recomienda mantener la atenci\u00f3n un poco m\u00e1s y praticar en casa usando el metr\u00f3nomo para mejorar las habilidades r\u00edtmicas y tener un mejor resultado de ese talento musical. \u00a1Muy bien! \ud83d\ude0a.", "porcentaje": 65.0, "clase": "Instrumento - Grupo B", "profesor": "Maria Camila Arellano"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "> Quiero resaltar tu buen trabajo en equipo, as\u00ed como las ganas de aprender que demuestras en cada clase. Mantienes siempre una buena disposici\u00f3n y actitud positiva durante las actividades, adem\u00e1s de ser respetuoso con tus compa\u00f1eros y el desarrollo de la clase.\n>\n> Como recomendaci\u00f3n, se sugiere escuchar con mayor atenci\u00f3n el tema de la canci\u00f3n y practicar m\u00e1s el rasgueo de la canci\u00f3n, ya que esto te permitir\u00e1 afianzar mejor los conceptos y mejorar tu desempe\u00f1o musical :3.", "porcentaje": 50.0, "clase": "Auralidad - Grupo B", "profesor": "Luna Arenas"}], "nombre_oficial": "CRISTIAN ANDRES RODRIGUEZ BURBANO", "instrumento_matriculado": "GUITARRA ACUSTICA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1095843930": {"nombre": "salome prado sandoval", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "G\u00e9nesis Moreno", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Alcances:\n-Letra correcta del repertorio asignado \n-Afinaci\u00f3n estable\n\nAspectos a mejorar:\n-Proyecci\u00f3n y foco del o": "CANTO", "programa_matriculado": "Instrumental Semi personalizado del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1099426341": {"nombre": "Owen Camilo Ni\u00f1o Neira", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Andr\u00e9s Prada", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-22", "observacion": "Owen es un ni\u00f1o excelente que siempre llega con muy buena actitud hacia la clase, se desenvuelve muy bien en las actividades que realizamos y se prepara para las mismas.", "porcentaje": 60.0, "clase": "Auralidad - Grupo B", "profesor": "Andr\u00e9s Prada"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "Buena coordinaci\u00f3n de ritmos y fills a pesar de la dificultad de la canci\u00f3n! Pr\u00e1cticar un poco me la semana pero todo muy bien", "porcentaje": 65.0, "clase": "Instrumento - Grupo B", "profesor": "Alejandro Vergel"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "Demuestra una adecuada capacidad para entonar y seguir el ritmo, manteniendo estabilidad en su desempe\u00f1o vocal. Se integra de manera efectiva al trabajo grupal, evidenciando disposici\u00f3n para escuchar y aportar al ensamble.\n\nAsimismo, logra solfear la melod\u00eda y posteriormente interpretarla con la letra, lo que refleja comprensi\u00f3n tanto musical como expresiva.\n\nSe destaca su compromiso y participaci\u00f3n en clase. Contin\u00faa as\u00ed, y puedes seguir fortaleciendo la proyecci\u00f3n de la voz y la seguridad esc\u00e9nica para alcanzar un resultado a\u00fan m\u00e1s s\u00f3lido.", "porcentaje": 100.0, "clase": "CORO - Prejuvenil", "profesor": "Daniela Visbal"}], "nombre_oficial": "Owen Camilo Ni\u00f1o Neira", "instrumento_matriculado": "BATERIA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1097130941": {"nombre": "Abril Hern\u00e1n
