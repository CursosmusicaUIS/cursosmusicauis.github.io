e que ha tenido \u00faltimamente, esto ocasiona una distracci\u00f3n en el grupo y en la ni\u00f1a, ya que llega en medio de la actividades que estamos desarrollando.", "porcentaje": 45.0, "clase": "Auralidad - Grupo B", "profesor": "Andr\u00e9s Prada"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-05", "observacion": "Juanita es una ni\u00f1a muy alegre y tiene mucha disposici\u00f3n para con las clases, pero hace falta que repase un poco m\u00e1s en casa los temas vistos en clase", "porcentaje": 60.0, "clase": "Instrumento - Grupo B", "profesor": "Andr\u00e9s Prada"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "Demuestra una adecuada capacidad para entonar y seguir el ritmo, manteniendo estabilidad en su desempe\u00f1o vocal. Se integra de manera efectiva al trabajo grupal, evidenciando disposici\u00f3n para escuchar y aportar al ensamble.\n\nAsimismo, logra solfear la melod\u00eda y posteriormente interpretarla con la letra, lo que refleja comprensi\u00f3n tanto musical como expresiva.\n\nSe destaca su compromiso y participaci\u00f3n en clase. Contin\u00faa as\u00ed, y puedes seguir fortaleciendo la proyecci\u00f3n de la voz y la seguridad esc\u00e9nica para alcanzar un resultado a\u00fan m\u00e1s s\u00f3lido.", "porcentaje": 100.0, "clase": "CORO - Prejuvenil", "profesor": "Daniela Visbal"}], "nombre_oficial": "JUANA VALENTINA PE\u00d1A MU\u00d1OZ", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1142716485": {"nombre": "Yasser Daniel Carvajal Jimenez", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Sara P\u00e1rraga", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Daniel ha mostrado un proceso muy positivo, con avances claros en el uso del arco, logrando un sonido m\u00e1s lleno y una mejor direcci\u00f3n. Ha superado la tendencia inicial de usar solo la punta, y ha asimilado muy bien el vibrato trabajado recientemente. Tambi\u00e9n ha demostrado buena disposici\u00f3n hacia la musicalidad y la intenci\u00f3n al tocar.\n\nSeguimos fortaleciendo la afinaci\u00f3n, la postura de la mano en el arco y la relajaci\u00f3n de ambas manos, as\u00ed como la seguridad en los cambios de posici\u00f3n. Va por un muy buen camino y, con pr\u00e1ctica constante, continuar\u00e1 consolidando estos aspectos.", "porcentaje": 70.0, "clase": "Instrumento - Grupo A", "profesor": "Sara P\u00e1rraga"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "El avance en conjunto con relaci\u00f3n al ensamble y el montaje de la canci\u00f3n ha sido bastante grato, ya que se ha evidenciado un progreso significativo. Aun as\u00ed, es importante seguir trabajando en algunos detalles y ajustes para lograr un mejor resultado.\n\nLa convivencia dentro del grupo es muy positiva, lo cual favorece un ambiente de clase agradable y permite avanzar de manera conjunta de forma m\u00e1s efectiva.\nSe felicita el avance del estudiante, ya que se ha evidenciado un proceso significativo tanto en la comprensi\u00f3n te\u00f3rica como en la pr\u00e1ctica de los temas trabajados. Este progreso refleja el compromiso y la constancia en su aprendizaje, lo cual es muy positivo para continuar fortaleciendo sus habilidades. Se recomienda, adem\u00e1s, mantener la concentraci\u00f3n durante las actividades y reducir la charla para un mejor rendimiento de la clase. :3", "porcentaje": 55.0, "clase": "Auralidad - Grupo A", "profesor": "Luna Arenas"}], "nombre_oficial": "Yasser Daniel Carvajal Jimenez", "instrumento_matriculado": "VIOLIN", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1142721063": {"nombre": "Julieta Castellanos C\u00e1ceres", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Sara P\u00e1rraga", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Julieta ha tenido un proceso muy positivo, asimilando con satisfacci\u00f3n los ejercicios de cambio de posici\u00f3n y mostrando una mejora clara en el manejo del arco. Su sonido ha evolucionado desde un inicio t\u00edmido hacia uno m\u00e1s presente, evidenciando avances importantes.\nSeguimos trabajando en fortalecer la proyecci\u00f3n del sonido y la seguridad al tocar, junto con el desarrollo del vibrato. Va por un buen camino y, con confianza y constancia, seguir\u00e1 avanzando.", "porcentaje": 85.0, "clase": "Instrumento - Grupo A", "profesor": "Sara P\u00e1rraga"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "El avance en conjunto con relaci\u00f3n al ensamble y el montaje de la canci\u00f3n ha sido bastante grato, ya que se ha evidenciado un progreso significativo. Aun as\u00ed, es importante seguir trabajando en algunos detalles y ajustes para lograr un mejor resultado.\n\nLa convivencia dentro del grupo es muy positiva, lo cual favorece un ambiente de clase agradable y permite avanzar de manera conjunta de forma m\u00e1s efectiva.\nSe felicita el avance del estudiante, ya que se ha evidenciado un proceso significativo tanto en la comprensi\u00f3n te\u00f3rica como en la pr\u00e1ctica de los temas trabajados. Este progreso refleja el compromiso y la constancia en su aprendizaje, lo cual es muy positivo para continuar fortaleciendo sus habilidades :3.", "porcentaje": 55.0, "clase": "Auralidad - Grupo A", "profesor": "Luna Arenas"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "", "porcentaje": 100.0, "clase": "CORO - Juvenil", "profesor": "Daniela Visbal"}], "nombre_oficial": "Julieta Castellanos C\u00e1ceres", "instrumento_matriculado": "VIOLIN", "programa_matriculado": "Instrumental Semi personalizado del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1095935525": {"nombre": "Lucia Quintero Dom\u00ednguez", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Sara P\u00e1rraga", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Luc\u00eda ha tenido un proceso muy positivo, destac\u00e1ndose por su compromiso y constancia, lo que se refleja en avances t\u00e9cnicos s\u00f3lidos desde que inici\u00f3. Ha logrado buenas bases en la afinaci\u00f3n y en el control inicial del arco.\nActualmente estamos enfoc\u00e1ndonos en perfeccionar el paso del arco, ya que en ocasiones tiende a desviarse, buscando mayor estabilidad, precisi\u00f3n y control del sonido. Va por un excelente camino", "porcentaje": 85.0, "clase": "Instrumento - Grupo B", "profesor": "Sara P\u00e1rraga"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "", "porcentaje": 100.0, "clase": "CORO - Juvenil", "profesor": "Daniela Visbal"}], "nombre_oficial": "Lucia Quintero Dom\u00ednguez", "instrumento_matriculado": "VIOLIN", "programa_matriculado": "Instrumental Semi personalizado del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1097510405": {"nombre": "Arturo Almeida Manzano", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Estudiante con una incre\u00edble actitud, suele ser el chico con m\u00e1s energ\u00eda de la clase y eso no es nada malo, al contrario, ayuda mucho su actitud para la clase, cada vez logra muy buenos avances en la trompeta, reconoce algunas notas con facilidad en la clave de sol, sin embargo debe tratar de memorizarlas al igual que reforzar de a poco la clave de fa, suele llegar un poco tarde a clases, es entendible que es la primera clase del d\u00eda m\u00e1s sin embargo se les recomienda llegar un poco antes al aula para aprovechar al m\u00e1ximo el tiempo de la clase. se le recomienda tambi\u00e9n escuchar mucho la canci\u00f3n del grupo \"Mais que nada - Sergio Mendes\".", "porcentaje": 90.0, "clase": "Auralidad - Grupo B", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "El proceso ha sido bastante grato y se ha evidenciado un buen avance. Hay una motivaci\u00f3n muy positiva tanto por parte del estudiante como en su relaci\u00f3n con el instrumento, lo cual es clave para continuar progresando.\n\nSe recomienda, sin embargo, trabajar un poco m\u00e1s en el orden y la organizaci\u00f3n a la hora de estudiar, ya que esto permitir\u00e1 aprovechar mejor el tiempo y consolidar los aprendizajes.\n\nEs importante recordar que no hay af\u00e1n: este es un proceso que requiere constancia y paciencia. El camino que se est\u00e1 recorriendo es muy bueno, y se nota un progreso significativo.", "porcentaje": 55.0, "clase": "Instrumento - Grupo B", "profesor": "Luna Arenas"}], "nombre_oficial": "Arturo Almeida Manzano", "instrumento_matriculado": "TROMPETA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1098741811": {"nombre": "jeronimo delgado porras", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Estudiante con buen sentido del pulso y el ritmo, reconoce las notas en su instrumento, canta y entona muy bien, suele tratar con fuerza o agresividad los instrumentos y cuando se le llama la atenci\u00f3n suele decir mentiras, de a poco mejora su disciplina pero se recomienda trabajarla cada vez m\u00e1s. Se le recomienda escuchar y aprenderse la segunda parte de la letra de la canci\u00f3n \"El pulpo cocinero - canticuentos\". Tiene mucho potencial y cada clase logra muy buenos avances", "porcentaje": 80.0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "Las obras trabajadas durante las clases han mostrado mejor\u00eda en la t\u00e9cnica, se recomienda fortalecer la canalizaci\u00f3n de energ\u00eda por medio de la respiraci\u00f3n, repasar las digitaciones en forma de ara\u00f1ita, y la postura para tocar.", "porcentaje": 59.0, "clase": "Instrumento - Grupo A", "profesor": "Camilo Orozco"}], "nombre_oficial": "jeronimo delgado porras", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1239090480": {"nombre": "Samuel Salvatore Vincenzo Martinez Olave", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Es el menor de la clase y sin embargo demuestra muchas habilidades musicales como llevar el pulso o cantar melod\u00edas, sin embargo sus capacidades motrices se encuentran a\u00fan en desarrollo lo que hace que se le dificulte a veces usar su instrumento, de poco usa el l\u00e1piz para dibujar figuras y la clave de sol, se le recomienda aprenderse toda la letra de la canci\u00f3n \"El pulpo cocinero - canticuentos\".", "porcentaje": 80.0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "El estudiante tiene mucho entusiasmo en las clases. Su energ\u00eda y dinamismo se reflejan en su participaci\u00f3n activa, y ya trae consigo un proceso de construcci\u00f3n personal muy s\u00f3lido. Sin embargo, a veces muestra dispersi\u00f3n en clase, lo que puede dificultar su seguimiento en los momentos grupales. No obstante, cuando logramos captar su atenci\u00f3n, su curiosidad se desborda, convirtiendo cada interacci\u00f3n en una exploraci\u00f3n profunda. Es un verdadero placer trabajar con \u00e9l, pues, a trav\u00e9s de su potencial, descubrimos nuevas rutas de aprendizaje.", "porcentaje": 80.0, "clase": "Instrumento - Grupo A", "profesor": "Ricardo Fortunato"}], "nombre_oficial": "Samuel Salvatore Vincenzo Martinez Olave", "instrumento_matriculado": "GUITARRA ACUSTICA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1097132450": {"nombre": "diana alejandra guevara duran", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Estudiante con buen sentido del pulso y el ritmo, reconoce las notas en su instrumento, canta y entona muy bien, juega y participa en las actividades planteadas en el sal\u00f3n. Se le recomienda seguir escuchar la canci\u00f3n \"El pulpo cocinero - canticuentos\". Tiene mucho potencial y cada clase logra muy buenos avances", "porcentaje": 90.0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "Se ha visto avances en la postura del instrumento, y tambi\u00e9n se ve el compromiso de la estudiante en el estudio.", "porcentaje": 90.0, "clase": "Instrumento - Grupo A", "profesor": "Mariana Pinto"}], "nombre_oficial": "Diana alejandra guevara duran", "instrumento_matriculado": "VIOLIN", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1142725688": {"nombre": "Samuel Quintero Oviedo", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Estudiante con buen sentido del pulso y el ritmo, reconoce las notas en su instrumento, canta y entona muy bien, juega y participa en las actividades planteadas en el sal\u00f3n. Se le recomienda seguir escuchar la canci\u00f3n \"El pulpo cocinero - canticuentos\". Tiene mucho potencial y cada clase logra muy buenos avances", "porcentaje": 90.0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "Se ha mejorado la postura del instrumento adem\u00e1s se ve el compromiso del ni\u00f1o con el estudio.", "porcentaje": 90.0, "clase": "Instrumento - Grupo A", "profesor": "Mariana Pinto"}], "nombre_oficial": "Samuel Quintero Oviedo", "instrumento_matriculado": "VIOLIN", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1005105544": {"nombre": "Ana Sof\u00eda Arias Calvete", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Estudiante con buen sentido del pulso y el ritmo, reconoce las notas en su instrumento, canta y entona muy bien aunque no le gusta hacerlo, juega y participa en las actividades planteadas en el sal\u00f3n. Se le recomienda seguir escuchar la canci\u00f3n \"El pulpo cocinero - canticuentos\". Tiene mucho potencial y cada clase logra muy buenos avances", "porcentaje": 80.0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}], "nombre_oficial": "Ana Sof\u00eda Arias Calvete", "instrumento_matriculado": "PENDIENTE", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1097143427": {"nombre": "Sara Ramirez Contreras", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Estudiante con buen sentido del pulso y el ritmo, reconoce las notas en su instrumento, canta y entona muy bien, juega y participa en las actividades planteadas en el sal\u00f3n. Se le recomienda escuchar y aprenderse la letra de la canci\u00f3n \"El pulpo cocinero - canticuentos\". Tiene mucho potencial y cada clase logra muy buenos avances", "porcentaje": 80.0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "Buena actitud hacia el trabajo de clase, mejorar postura al tocar, proyecci\u00f3n de la voz al cantar con el piano y digitaci\u00f3n sin doblar falanges, en forma de ara\u00f1ita.", "porcentaje": 67.0, "clase": "Instrumento - Grupo A", "profesor": "Camilo Orozco"}], "nombre_oficial": "Sara Ramirez Contreras", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1092544378": {"nombre": "Andr\u00e9s Camilo Araque Bermon", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Estudiante con una incre\u00edble actitud, suele ser el chico con m\u00e1s energ\u00eda de la clase y eso no es nada malo, al contrario, ayuda mucho su actitud para la clase. Reconoce las notas de la clave de sol, entona y canta muy bien, entiende las edades y las diferencias que hay entre \u00e9l y sus compa\u00f1eros y aprovecha eso al m\u00e1ximo, se le recomienda tratar de estudiar un poco m\u00e1s los ritmos de cumbia en los timbales, y seguir escuchando la canci\u00f3n del grupo.", "porcentaje": 95.0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "Buen proceso! Practicar en la semana lo visto en clase!", "porcentaje": 70.0, "clase": "Instrumento - Grupo A", "profesor": "Alejandro Vergel"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "Demuestra una buena capacidad para entonar y seguir el ritmo, manteniendo estabilidad en su interpretaci\u00f3n vocal. Se integra de manera adecuada al trabajo grupal, mostrando disposici\u00f3n para escuchar y aportar al ensamble.\n\nAsimismo, logra solfear leyendo la melod\u00eda y luego interpretarla con la letra, evidenciando comprensi\u00f3n tanto musical como expresiva.\n\nSe destaca su compromiso y participaci\u00f3n en clase. Contin\u00faa as\u00ed, y puedes seguir fortaleciendo la proyecci\u00f3n de la voz y la seguridad en tu interpretaci\u00f3n para lograr un resultado a\u00fan m\u00e1s s\u00f3lido.", "porcentaje": 100.0, "clase": "CORO - Prejuvenil", "profesor": "Daniela Visbal"}], "nombre_oficial": "Andr\u00e9s Camilo Araque Bermon", "instrumento_matriculado": "BATERIA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1097307398": {"nombre": "Hernan Jos\u00e9 lizarazo Ayala", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Estudiante con buen sentido del pulso y el ritmo, reconoce las notas en su instrumento, canta y entona muy bien, no suele participar ni jugar en algunas actividades si se le ha llamado previamente la atenci\u00f3n, de a poco mejora su disciplina pero se recomienda trabajarla cada vez m\u00e1s. Se le recomienda escuchar y aprenderse la segunda parte de la letra de la canci\u00f3n \"El pulpo cocinero - canticuentos\". Tiene mucho potencial y cada clase logra muy buenos avances", "porcentaje": 75.0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "Gracias a su disposici\u00f3n y pasi\u00f3n se han podido desarrollar la totalidad de actividades propuestas, se sugiere ejercitar; la concentraci\u00f3n, motricidad fina de los dedos en forma de ara\u00f1ita, cantar y tocar al tiempo.", "porcentaje": 55.0, "clase": "Instrumento - Grupo A", "profesor": "Camilo Orozco"}], "nombre_oficial": "Hernan Jos\u00e9 lizarazo Ayala", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1097511282": {"nombre": "Maria Luc\u00eda Gomez Ruiz", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Estudiante con buen sentido del pulso y el ritmo, reconoce las notas en su instrumento, canta y entona muy bien pero no le gusta hacerlo, juega y participa en las actividades planteadas en el sal\u00f3n. Se le recomienda seguir escuchar la canci\u00f3n \"El pulpo cocinero - canticuentos\". Tiene mucho potencial y cada clase logra muy buenos avances", "porcentaje": 85.0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "El estudiante es una persona constante y dedicada. Siempre llega a clase con una actitud positiva y participa activamente en las din\u00e1micas. Cumple con todas las tareas a tiempo, mostrando un gran inter\u00e9s por aprender. Su estabilidad se refleja en su organizaci\u00f3n y en la calidad de su trabajo, convirti\u00e9ndolo en un ejemplo para sus compa\u00f1eros.", "porcentaje": 90.0, "clase": "Instrumento - Grupo A", "profesor": "Ricardo Fortunato"}], "nombre_oficial": "Maria Luc\u00eda Gomez Ruiz", "instrumento_matriculado": "GUITARRA ACUSTICA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1239090032": {"nombre": "Caleb Pineda Alvarez", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Estudiante con buen sentido del pulso y el ritmo, reconoce las notas en su instrumento, canta y entona muy bien aunque no le gusta hacerlo, juega y participa en las actividades planteadas en el sal\u00f3n. Se le recomienda seguir escuchar la canci\u00f3n \"El pulpo cocinero - canticuentos\". Tiene mucho potencial y cada clase logra muy buenos avances", "porcentaje": 80.0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "Excelente coordinaci\u00f3n en cuanto a ritmos y fills de bater\u00eda! Trabajar atentamente durante la clase y practicar en casa lo visto en clase", "porcentaje": 60.0, "clase": "Instrumento - Grupo A", "profesor": "Alejandro Vergel"}], "nombre_oficial": "Caleb Pineda Alvarez", "instrumento_matriculado": "BATERIA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "37839698": {"nombre": "Gloria Le\u00f3n Berm\u00fadez", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Muy buenos avances, reconoce las notas y las ubica en el piano, de a poco mejora su pulso y ritmo, puede leer melod\u00edas y tocarlas con la mano derecha, de a poco su mano izquierda reconoce y crea una postura para su memoria muscular, se le recomienda estudiar m\u00e1s la canci\u00f3n \"Cielito Lindo\".", "porcentaje": 90.0, "clase": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Pone en practica los conocimientos te\u00f3ricos que aprende en clase con cierta facilidad, reconoce las notas de las claves de Sol y Fa, de a poco mejora en los cambios de acorde de la canci\u00f3n en el piano, sin embargo se le recomienda estudiarlos un poco m\u00e1s, se le recomienda no desconfiar de sus capacidades, ha logrado muy buenos avances.", "porcentaje": 0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}], "nombre_oficial": "Gloria Le\u00f3n Berm\u00fadez", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "63322594": {"nombre": "Bernarda Ballesteros G\u00f3mez", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Muy buenos avances, reconoce las notas y las ubica en el piano, de a poco mejora su pulso y ritmo, puede leer melod\u00edas y tocarlas con la mano derecha, de a poco su mano izquierda reconoce y crea una postura para su memoria muscular. De a poco mejora su estudio con el metr\u00f3nomo, hay que tratar de seguir us\u00e1ndolo para estudiar. seguir avanzando en la lectura del torbellino", "porcentaje": 90.0, "clase": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}], "nombre_oficial": "Bernarda Ballesteros G\u00f3mez", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1096702631": {"nombre": "MARCO JAVIER DE JESUS HERNANDEZ MELENDEZ", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "De a poco reconoce y entiende la funci\u00f3n de la clave de sol y fa en el pentagrama, cada vez logra muy buenos avances en sus capacidades motrices al desarrollar ejercicios de control del pulso y del ritmo, tiene buen o\u00eddo y reconoce con poca dificultad los acordes mayores y menores. Se le recomienda escuchar m\u00e1s seguido la canci\u00f3n del grupo \"La piragua\"", "porcentaje": 85.0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "Exelente proceso en cuanto a coordinaci\u00f3n de ritmos y fills y sonoridades de la bater\u00eda!", "porcentaje": 50.0, "clase": "Instrumento - Grupo A", "profesor": "Alejandro Vergel"}], "nombre_oficial": "MARCO JAVIER DE JESUS HERNANDEZ MELENDEZ", "instrumento_matriculado": "BATERIA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "63349837": {"nombre": "DELCY RODRIGUEZ BURBANO", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Pone en practica los conocimientos te\u00f3ricos que aprende en clase con cierta facilidad, reconoce las notas de las claves de Sol y Fa, se le difuculta entonar algunas notas o reconcer algunos acordes auditivamente, pero cada vez logra muy buenos avances, reconoce su rol en la canci\u00f3n del grupo. Tiene buen ritmo y sentido de la pulsaci\u00f3n, se le recomienda, escuchar muchas versiones de la piragua y cantarlas as\u00ed sean en otro estilo", "porcentaje": 85.0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "Muestra disposici\u00f3n y actitud positiva hacia el trabajo vocal, participando en las actividades propuestas. Se encuentra en proceso de fortalecer la identificaci\u00f3n del ritmo y la melod\u00eda, as\u00ed como su integraci\u00f3n con la armon\u00eda durante la interpretaci\u00f3n. El manejo de la respiraci\u00f3n contin\u00faa desarroll\u00e1ndose para impactar la estabilidad vocal. De igual manera, avanza en la construcci\u00f3n de mayor seguridad y preparaci\u00f3n para su presentaci\u00f3n final.", "porcentaje": 100.0, "clase": "Instrumento - Grupo A", "profesor": "Daniela Visbal"}], "nombre_oficial": "DELCY RODRIGUEZ BURBANO", "instrumento_matriculado": "CANTO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "4191593": {"nombre": "Hernando Rodriguez Ochoa", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Muy buena actitud, al igual que sentido del ritmo y del pulso, reconoce las notas de la clave de fa y sol, se le facilita y reconoce algunos de los acordes mayores y menores de su instrumento, pone en practica los conocimientos te\u00f3ricos que aprende en clase. Seguir trabajando los cambios de acorde de la canci\u00f3n \"La Piragua\".", "porcentaje": 0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "El estudiante es una persona constante y dedicada. Siempre llega a clase con una actitud positiva y participa activamente en las din\u00e1micas. Cumple con todas las tareas a tiempo, mostrando un gran inter\u00e9s por aprender. Su estabilidad se refleja en su organizaci\u00f3n y en la calidad de su trabajo, convirti\u00e9ndolo en un ejemplo para sus compa\u00f1eros.", "porcentaje": 90.0, "clase": "Instrumento - Grupo A", "profesor": "Ricardo Fortunato"}], "nombre_oficial": "Hernando Rodriguez Ochoa", "instrumento_matriculado": "GUITARRA ACUSTICA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "63313001": {"nombre": "Nelly Carre\u00f1o Moreno", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-04-29", "observacion": "Suele desconfiar de sus capacidades a pesar de tener mucho talento, reconoce las notas en las claves de sol y fa, tiene buen sentido del ritmo y de la pulsaci\u00f3n, de a poco reconoce y forma los acordes en la guitarra, al igual que logra un buen rasgueo con la mano derecha, seguir estudiando los cambios de acordes de la canci\u00f3n \"La Piragua\"", "porcentaje": 85.0, "clase": "Auralidad - Grupo A", "profesor": "Jas\u00f3n Pinz\u00f3n"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "Esta estudiante es verdaderamente admirable. Se destaca por su estabilidad y su solidez interna; se ve en ella un deseo genuino de aprender. Sus ganas son palpables, pero tambi\u00e9n es esencial comprender su proceso. Ella sabe que el camino del aprendizaje no es una carrera apresurada, sino un andar pausado, en el que la calma y la reflexi\u00f3n son aliadas. Es una estudiante destacable, no solo por sus logros, sino por la forma serena y consciente en que recorre cada paso del camino.", "porcentaje": 90.0, "clase": "Instrumento - Grupo A", "profesor": "Ricardo Fortunato"}], "nombre_oficial": "Nelly Carre\u00f1o Moreno", "instrumento_matriculado": "GUITARRA ACUSTICA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1239093431": {"nombre": "Mar\u00edapaz Velandia D\u00edaz", "programa": "Musicaminadores", "instrumento": "nan", "profesor": "Ricardo Fortunato", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "El estudiante es una persona constante y dedicada. Siempre llega a clase con una actitud positiva y participa activamente en las din\u00e1micas. Cumple con todas las tareas a tiempo, mostrando un gran inter\u00e9s por aprender. Su estabilidad se refleja en su organizaci\u00f3n y en la calidad de su trabajo, convirti\u00e9ndolo en un ejemplo para sus compa\u00f1eros.", "porcentaje": 90.0, "clase": "Expresi\u00f3n Musical", "profesor": "Ricardo Fortunato"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "El grupo \u201cM\u00fasicaminadores\u201d ha mostrado un avance significativo en su proceso general, evidenci\u00e1ndose especialmente en el desarrollo motriz de los estudiantes, quienes han logrado mayor coordinaci\u00f3n, ritmo y expresi\u00f3n corporal a trav\u00e9s de las actividades propuestas. Asimismo, se ha observado un progreso importante en la discriminaci\u00f3n auditiva de los beb\u00e9s, quienes responden con mayor atenci\u00f3n y diferenciaci\u00f3n ante los est\u00edmulos sonoros y musicales.\n\nCabe resaltar que el trabajo realizado con las canciones anteriores ha dado resultados muy positivos, ya que estas han favorecido la participaci\u00f3n, el reconocimiento de sonidos y la apropiaci\u00f3n de din\u00e1micas musicales. En conjunto, estos logros reflejan el impacto favorable del proceso pedag\u00f3gico, motivando a continuar fortaleciendo las estrategias implementadas", "porcentaje": 50.0, "clase": "M\u00fasicaminadores", "profesor": "Luna Arenas"}], "nombre_oficial": "Mar\u00edapaz Velandia D\u00edaz", "instrumento_matriculado": "", "programa_matriculado": "Preiniciaci\u00f3n musical (3- 4 a\u00f1os)"}, "1097151908": {"nombre": "Iker Santiago Archila Jaimes", "programa": "Preiniciaci\u00f3n", "instrumento": "nan", "profesor": "Ricardo Fortunato", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "El estudiante es una persona constante y dedicada. Siempre llega a clase con una actitud positiva y participa activamente en las din\u00e1micas. Cumple con todas las tareas a tiempo, mostrando un gran inter\u00e9s por aprender. Su estabilidad se refleja en su organizaci\u00f3n y en la calidad de su trabajo, convirti\u00e9ndolo en un ejemplo para sus compa\u00f1eros.", "porcentaje": 90.0, "clase": "Expresi\u00f3n Musical", "profesor": "Ricardo Fortunato"}], "nombre_oficial": "Iker Santiago Archila Jaimes", "instrumento_matriculado": "", "programa_matriculado": "Preiniciaci\u00f3n musical (3- 4 a\u00f1os)"}, "1098837509": {"nombre": "Isabella Aguill\u00f3n Pe\u00f1aranda", "programa": "Preiniciaci\u00f3n", "instrumento": "nan", "profesor": "Ricardo Fortunato", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "El estudiante es una persona constante y dedicada. Siempre llega a clase con una actitud positiva y participa activamente en las din\u00e1micas. Cumple con todas las tareas a tiempo, mostrando un gran inter\u00e9s por aprender. Su estabilidad se refleja en su organizaci\u00f3n y en la calidad de su trabajo, convirti\u00e9ndolo en un ejemplo para sus compa\u00f1eros.", "porcentaje": 90.0, "clase": "Expresi\u00f3n Musical", "profesor": "Ricardo Fortunato"}], "nombre_oficial": "Isabella Aguill\u00f3n Pe\u00f1aranda", "instrumento_matriculado": "", "programa_matriculado": "Preiniciaci\u00f3n musical (3- 4 a\u00f1os)"}, "1098082103": {"nombre": "Juan Camilo Obregon Maldonado", "programa": "Preiniciaci\u00f3n", "instrumento": "nan", "profesor": "Ricardo Fortunato", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "El estudiante es una persona constante y dedicada. Siempre llega a clase con una actitud positiva y participa activamente en las din\u00e1micas. Cumple con todas las tareas a tiempo, mostrando un gran inter\u00e9s por aprender. Su estabilidad se refleja en su organizaci\u00f3n y en la calidad de su trabajo, convirti\u00e9ndolo en un ejemplo para sus compa\u00f1eros.", "porcentaje": 90.0, "clase": "Expresi\u00f3n Musical", "profesor": "Ricardo Fortunato"}]}, "1095316609": {"nombre": "Alejandro Prada Gutierrez", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Ricardo Fortunato", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "Este estudiante es muy aplicado. Su pasi\u00f3n por el aprendizaje es evidente: se le nota que disfruta cada actividad y se compromete con las metas que se propone. Sin embargo, hay un reto importante: a pesar de su entusiasmo, en ocasiones no logra revisar el material en casa. Esto provoca que, al volver a clase, se sienta presionado, y la din\u00e1mica se repite, impidiendo un avance m\u00e1s profundo. Es crucial acompa\u00f1arlo con estrategias de organizaci\u00f3n y motivaci\u00f3n, para que pueda, paso a paso, transformar ese entusiasmo en h\u00e1bitos sostenidos de estudio.", "porcentaje": 90.0, "clase": "Instrumento - Grupo A", "profesor": "Ricardo Fortunato"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "Demuestra una adecuada capacidad para entonar y seguir el ritmo, manteniendo estabilidad en su desempe\u00f1o vocal. Se integra de manera efectiva al trabajo grupal, evidenciando disposici\u00f3n para escuchar y aportar al ensamble.\n\nAsimismo, logra solfear la melod\u00eda y posteriormente interpretarla con la letra, lo que refleja comprensi\u00f3n tanto musical como expresiva.\n\nSe destaca su compromiso y participaci\u00f3n en clase. Contin\u00faa as\u00ed, y puedes seguir fortaleciendo la proyecci\u00f3n de la voz y la seguridad esc\u00e9nica para alcanzar un resultado a\u00fan m\u00e1s s\u00f3lido.", "porcentaje": 100.0, "clase": "CORO - Prejuvenil", "profesor": "Daniela Visbal"}], "nombre_oficial": "Alejandro Prada Gutierrez", "instrumento_matriculado": "UKELELE", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1097503604": {"nombre": "Yecithy Alejandro S\u00e1nchez Becerra", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Ricardo Fortunato", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-01", "observacion": "El estudiante es una persona constante y dedicada. Siempre llega a clase con una actitud positiva y participa activamente en las din\u00e1micas. Cumple con todas las tareas a tiempo, mostrando un gran inter\u00e9s por aprender. Su estabilidad se refleja en su organizaci\u00f3n y en la calidad de su trabajo, convirti\u00e9ndolo en un ejemplo para sus compa\u00f1eros.", "porcentaje": 90.0, "clase": "Instrumento - Grupo A", "profesor": "Ricardo Fortunato"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "El avance en conjunto con relaci\u00f3n al ensamble y el montaje de la canci\u00f3n ha sido bastante grato, ya que se ha evidenciado un progreso significativo. Aun as\u00ed, es importante seguir trabajando en algunos detalles y ajustes para lograr un mejor resultado.\n\nLa convivencia dentro del grupo es muy positiva, lo cual favorece un ambiente de clase agradable y permite avanzar de manera conjunta de forma m\u00e1s efectiva.\n\nSe evidencia una buena comprensi\u00f3n de los temas trabajados y un avance positivo en el proceso de aprendizaje; sin embargo, es necesario reforzar la pr\u00e1ctica para afianzar los conocimientos y mejorar su aplicaci\u00f3n, adem\u00e1s de mantener una mayor concentraci\u00f3n durante la clase para aprovechar mejor el tiempo y los contenidos.\nSe evidencia el aprendizaje en el proceso, lo cual refleja el esfuerzo realizado hasta el momento. Sin embargo, es necesario reforzar un poco m\u00e1s la concentraci\u00f3n y dedicar mayor tiempo al estudio de temas como las m\u00e9tricas, con el fin de afianzar los conocimientos y mejorar el desempe\u00f1o.\n\nDe igual forma, se reconoce y felicita el compromiso demostrado, ya que es un aspecto clave para seguir avanzando de manera constante y exitosa en el proceso de formaci\u00f3n :3.", "porcentaje": 50.0, "clase": "Auralidad - Grupo A", "profesor": "Luna Arenas"}], "nombre_oficial": "Yecithy Alejandro S\u00e1nchez Becerra", "instrumento_matriculado": "GUITARRA ACUSTICA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00 ion": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "El grupo \u201cM\u00fasicaminadorea\u201d ha mostrado un avance significativo en su proceso general, evidenci\u00e1ndose especialmente en el desarrollo motriz de los estudiantes, quienes han logrado mayor coordinaci\u00f3n, ritmo y expresi\u00f3n corporal a trav\u00e9s de las actividades propuestas. Asimismo, se ha observado un progreso importante en la discriminaci\u00f3n auditiva de los beb\u00e9s, quienes responden con mayor atenci\u00f3n y diferenciaci\u00f3n ante los est\u00edmulos sonoros y musicales.\n\nCabe resaltar que el trabajo realizado con las canciones anteriores ha dado resultados muy positivos, ya que estas han favorecido la participaci\u00f3n, el reconocimiento de sonidos y la apropiaci\u00f3n de din\u00e1micas musicales. En conjunto, estos logros reflejan el impacto favorable del proceso pedag\u00f3gico, motivando a continuar fortaleciendo las estrategias implementadas.\n\nSe felicita la motivaci\u00f3n del estudiante.", "porcentaje": 55.0, "clase": "M\u00fasicaminadores", "profesor": "Luna Arenas"}], "nombre_oficial": "Salom\u00f3n Fonseca Aparicio", "instrumento_matriculado": "", "programa_matriculado": "M\u00fasicaminadores ( a partir de 1 a\u00f1o requisito: caminar)"}, "1097512980": {"nombre": "Lucio Matteo Cruz Contreras", "programa": "Musicaminadores", "instrumento": "nan", "profesor": "Luna Arenas", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "El grupo \u201cM\u00fasicaminadores\u201d ha mostrado un avance significativo en su proceso general, evidenci\u00e1ndose especialmente en el desarrollo motriz de los estudiantes, quienes han logrado mayor coordinaci\u00f3n, ritmo y expresi\u00f3n corporal a trav\u00e9s de las actividades propuestas. Asimismo, se ha observado un progreso importante en la discriminaci\u00f3n auditiva de los beb\u00e9s, quienes responden con mayor atenci\u00f3n y diferenciaci\u00f3n ante los est\u00edmulos sonoros y musicales.\n\nCabe resaltar que el trabajo realizado con las canciones anteriores ha dado resultados muy positivos, ya que estas han favorecido la participaci\u00f3n, el reconocimiento de sonidos y la apropiaci\u00f3n de din\u00e1micas musicales. En conjunto, estos logros reflejan el impacto favorable del proceso pedag\u00f3gico, motivando a continuar fortaleciendo las estrategias implementadas. \n\nObservaci\u00f3n: \nSe observa que el beb\u00e9 se encuentra en un proceso progresivo de reconocimiento y autorregulaci\u00f3n de sus emociones. Durante las actividades, manifiesta en algunos momentos expresiones de ira y cierta dificultad en la tolerancia ante situaciones que no responden de inmediato a sus necesidades, lo cual se evidencia a trav\u00e9s de gestos, sonidos y movimientos corporales; sin embargo, poco a poco comienza a identificar estos estados emocionales y, con el acompa\u00f1amiento del adulto, logra regularse con mayor facilidad, avanzando en la comprensi\u00f3n y manejo de sus propias emociones", "porcentaje": 50.0, "clase": "M\u00fasicaminadores", "profesor": "Luna Arenas"}], "nombre_oficial": "Lucio Matteo Cruz Contreras", "instrumento_matriculado": "", "programa_matriculado": "M\u00fasicaminadores ( a partir de 1 a\u00f1o requisito: caminar)"}, "1097158330": {"nombre": "Sara Luciana Saavedra Mesa", "programa": "Musicaminadores", "instrumento": "nan", "profesor": "Luna Arenas", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "El grupo \u201cM\u00fasicaminadores\u201d ha mostrado un avance significativo en su proceso general, evidenci\u00e1ndose especialmente en el desarrollo motriz de los estudiantes, quienes han logrado mayor coordinaci\u00f3n, ritmo y expresi\u00f3n corporal a trav\u00e9s de las actividades propuestas. Asimismo, se ha observado un progreso importante en la discriminaci\u00f3n auditiva de los beb\u00e9s, quienes responden con mayor atenci\u00f3n y diferenciaci\u00f3n ante los est\u00edmulos sonoros y musicales.\n\nCabe resaltar que el trabajo realizado con las canciones anteriores ha dado resultados muy positivos, ya que estas han favorecido la participaci\u00f3n, el reconocimiento de sonidos y la apropiaci\u00f3n de din\u00e1micas musicales. En conjunto, estos logros reflejan el impacto favorable del proceso pedag\u00f3gico, motivando a continuar fortaleciendo las estrategias implementadas. \n\nRecordarles la exploraci\u00f3n es parte del proceso.", "porcentaje": 50.0, "clase": "M\u00fasicaminadores", "profesor": "Luna Arenas"}], "nombre_oficial": "Sara Luciana Saavedra Mesa", "instrumento_matriculado": "", "programa_matriculado": "M\u00fasicaminadores ( a partir de 1 a\u00f1o requisito: caminar)"}, "1095909444": {"nombre": "DIANA CAROLINA PARRA ZAFRA", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Luna Arenas", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "El avance en conjunto con relaci\u00f3n al ensamble y el montaje de la canci\u00f3n ha sido bastante grato, ya que se ha evidenciado un progreso significativo. Aun as\u00ed, es importante seguir trabajando en algunos detalles y ajustes para lograr un mejor resultado.\n\nLa convivencia dentro del grupo es muy positiva, lo cual favorece un ambiente de clase agradable y permite avanzar de manera conjunta de forma efectiva. \nSe evidencia el aprendizaje en el proceso, lo cual refleja el esfuerzo realizado hasta el momento. Sin embargo, es necesario reforzar un poco m\u00e1s la concentraci\u00f3n y dedicar mayor tiempo al estudio de temas como las m\u00e9tricas, con el fin de afianzar los conocimientos y mejorar el desempe\u00f1o.\n\nDe igual forma, se reconoce y felicita el compromiso demostrado, ya que es un aspecto clave para seguir avanzando de manera constante y exitosa en el proceso de formaci\u00f3n :3.", "porcentaje": 50.0, "clase": "Auralidad - Grupo A", "profesor": "Luna Arenas"}, {"revision har de mejor manera las clases", "porcentaje": 50.0, "clase": "Instrumento - Grupo B", "profesor": "Andr\u00e9s Prada"}], "nombre_oficial": "Danna Sharlott E.E Quiroga Sandoval", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1097785909": {"nombre": "Miguel \u00c1ngel Robayo Aguill\u00f3n", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Luna Arenas", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "Quiero felicitarte por el buen trabajo en equipo que realizas, el cual contribuye de manera positiva al desarrollo de las actividades en clase. Tambi\u00e9n destaco tu dedicaci\u00f3n al estudio de los temas vistos, lo que se refleja en tu progreso y comprensi\u00f3n.\n\nContin\u00faa con ese compromiso y esfuerzo, ya que te permitir\u00e1 seguir avanzando y fortaleciendo tus aprendizajes.", "porcentaje": 55.0, "clase": "Auralidad - Grupo B", "profesor": "Luna Arenas"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-05", "observacion": "Migue es un joven que me ha sorprendido mucho, en el poco tiempo de clase que llevamos he visto un avance significativo en su dominio del piano, se ve a simple vista que le dedica bastante tiempo a repasar los temas que vemos en clase y si sigue con el mismo compromiso va a llegar muy lejos", "porcentaje": 80.0, "clase": "Instrumento - Grupo B", "profesor": "Andr\u00e9s Prada"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "", "porcentaje": 100.0, "clase": "CORO - Juvenil", "profesor": "Daniela Visbal"}], "nombre_oficial": "Miguel \u00c1ngel Robayo Aguill\u00f3n", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "63525152": {"nombre": "Angie Gabriela Pab\u00f3n Ortega", "programa": "Instrumental", "in daci\u00f3n, es importante que contin\u00faes estudiando los temas vistos en clases pasadas, ya que esto te permitir\u00e1 afianzar mejor los conocimientos y seguir fortaleciendo tu desempe\u00f1o acad\u00e9mico..", "porcentaje": 50.0, "clase": "Auralidad - Grupo B", "profesor": "Luna Arenas"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "Demuestra una s\u00f3lida comprensi\u00f3n musical al identificar con precisi\u00f3n el ritmo y la melod\u00eda, logrando integrarse adecuadamente con la armon\u00eda durante la interpretaci\u00f3n vocal. Evidencia control de la respiraci\u00f3n, lo que favorece una ejecuci\u00f3n estable y afinada. Adem\u00e1s, planifica conscientemente su desempe\u00f1o esc\u00e9nico, mostrando seguridad y preparaci\u00f3n para la presentaci\u00f3n final.", "porcentaje": 100.0, "clase": "Instrumento - Grupo B", "profesor": "Daniela Visbal"}], "nombre_oficial": "Daniel Alejandro Vega Nieves", "instrumento_matriculado": "CANTO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1139127656": {"nombre": "JHOJAN SNEYDER MENDOZA GOMEZ", "programa": "Instrumental", "instrumento": "Instrumento - Grupo A", "profesor": "Alejandro Vergel", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "Tratar de mantener el pulso interno de la canci\u00f3n, es decir no adelantarnos ni atrasarnos con la velocidad del tema. El ritmo y los fills est\u00e1n muy bien. Se recomienda repasar en casa.", "porcentaje": 50.0, "clase": "Instrumento - Grupo A", "profesor": "Alejandro Vergel"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "Demuestra una adecuada capacidad para entonar y seguir el ritmo, manteniendo estabilidad en su desempe\u00f1o vocal. Se integra de manera efectiva al trabajo grupal, evidenciando disposici\u00f3n para escuchar y aportar al ensamble.\n\nAsimismo, logra solfear la melod\u00eda y posteriormente interpretarla con la letra, lo que refleja comprensi\u00f3n tanto musical como expresiva.\n\nSe destaca su compromiso y participaci\u00f3n en clase. Contin\u00faa as\u00ed, y puedes seguir fortaleciendo la proyecci\u00f3n de la voz y la seguridad esc\u00e9nica para alcanzar un resultado a\u00fan m\u00e1s s\u00f3lido.", "porcentaje": 100.0, "clase": "CORO - Prejuvenil", "profesor": "Daniela Visbal"}], "nombre_oficial": "JHOJAN SNEYDER MENDOZA GOMEZ", "instrumento_matriculado": "BATERIA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1142722372": {"nombre": "Santiago Sebasti\u00e1n Chaves Jaimes", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Alejandro Vergel", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "Pr\u00e1cticar en casa el ritmo principal! Y escuchar el tema", "porcentaje": 50.0, "clase": "Instrumento - Grupo B", "profesor": "Alejandro Vergel"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-05", "observacion": "Demuestra una muy buena comprensi\u00f3n de los patrones r\u00edtmicos trabajados en clase, logrando identificar y ejecutar con seguridad figuras como corcheas, tresillos y semicorcheas. Se nota un avance s\u00f3lido en su proceso.\nEn cuanto a la construcci\u00f3n de escalas mayores, entiende claramente su estructura y logra crearlas correctamente, incluyendo sus alteraciones, lo que evidencia un buen dominio te\u00f3rico.\nEn el trabajo de ensamble, interpreta la canci\u00f3n \u201cPari\u00f3 la luna\u201d con seguridad, respetando los cambios r\u00edtmicos, las din\u00e1micas y los cortes, integr\u00e1ndose muy bien con el grupo.\n\nEs importante mejorar la puntualidad, ya que llegar tarde hace que se pierda explicaciones clave para su aprendizaje. Con mayor compromiso en este aspecto y pr\u00e1ctica constante, puede lograr avances significativos.", "porcentaje": 100.0, "clase": "Auralidad - Grupo B", "profesor": "Daniela Visbal"}], "nombre_oficial": "Santiago Sebasti\u00e1n Chaves Jaimes", "instrumento_matriculado": "BATERIA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1097129405": {"nombre": "Jacobo Pineda Alvarez", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Alejandro Vergel", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "Exelente proceso! Buen tempo interno y todos los fills y ritmos completados", "porcentaje": 90.0, "clase": "Instrumento - Grupo B", "profesor": "Alejandro Vergel"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-05", "observacion": "Demuestra una muy buena comprensi\u00f3n de los patrones r\u00edtmicos trabajados en clase, logrando identificar y ejecutar con seguridad figuras como corcheas, tresillos y semicorcheas. Se nota un avance s\u00f3lido en su proceso.\nEn cuanto a la construcci\u00f3n de escalas mayores, entiende claramente su estructura y logra crearlas correctamente, incluyendo sus alteraciones, lo que evidencia un buen dominio te\u00f3rico.\nEn el trabajo de ensamble, interpreta la canci\u00f3n \u201cPari\u00f3 la luna\u201d con seguridad, respetando los cambios r\u00edtmicos, las din\u00e1micas y los cortes, integr\u00e1ndose muy bien con el grupo.", "porcentaje": 99.0, "clase": "Auralidad - Grupo B", "profesor": "Daniela Visbal"}], "nombre_oficial": "Jacobo Pineda Alvarez", "instrumento_matriculado": "BATERIA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1115738355": {"nombre": "Jesus Santiago Ni\u00f1o Basto", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Alejandro Vergel", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-04", "observacion": "Buena coordinaci\u00f3n de t e": "Maria Fernanda Dur\u00e1n Abaunza", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Andr\u00e9s Prada", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-05", "observacion": "Mafe se desenvuelve muy bien en el Instrumento, pero ha medida que pasan las clases los ejercicios y peque\u00f1as piezas se vuelven m\u00e1s complejas, por eso tiene que empezar a dedicarle m\u00e1s tiempo de estudio personal al instrumento, no solo el tiempo de la clase, para que as\u00ed pueda aprovechar de mejor manera las clases", "porcentaje": 50.0, "clase": "Instrumento - Grupo B", "profesor": "Andr\u00e9s Prada"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "", "porcentaje": 100.0, "clase": "CORO - Juvenil", "profesor": "Daniela Visbal"}], "nombre_oficial": "Maria Fernanda Dur\u00e1n Abaunza", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1221463998": {"nombre": "Sarah Angieline Carrillo Moncada", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Daniela Visbal", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-05", "observacion": "Logra identificar algunos patrones r\u00edtmicos trabajados en clase, como corcheas y figuras b\u00e1sicas, aunque a\u00fan presenta dificultades para ejecutarlos con fluidez, especialmente en ritmos m\u00e1s complejos como tresillos y semicorcheas.\nEn la construcci\u00f3n de escalas mayores, comprende parcialmente la estructura, pero necesita mayor pr\u00e1ctica para aplicar correctamente las alteraciones y ganar seguridad en su desarrollo.\nEn el ensamble, participa en la interpretaci\u00f3n de \u201cPari\u00f3 la luna\u201d, sin embargo, en ocasiones se le dificulta seguir con precisi\u00f3n los cambios r\u00edtmicos, din\u00e1micas y cortes, lo que afecta su integraci\u00f3n con el grupo.\nEs importante mejorar la puntualidad, ya que llegar tarde hace que se pierda explicaciones clave para su aprendizaje. Con mayor compromiso en este aspecto y pr\u00e1ctica constante, puede lograr avances significativos.", "porcentaje": 100.0, "clase": "Auralidad - Grupo B", "profesor": "Daniela Visbal"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-05", "observacion": "Demuestra una muy buena comprensi\u00f3n de los patrones r\u00edtmicos trabajados en clase, logrando identificar y ejecutar con seguridad figuras como corcheas, tresillos y semicorcheas. Se nota un avance s\u00f3lido en su proceso.\nEn cuanto a la construcci\u00f3n de escalas mayores, entiende claramente su estructura y logra crearlas correctamente, incluyendo sus alteraciones, lo que evidencia un buen dominio te\u00f3rico.\nEn el trabajo de ensamble, interpreta la canci\u00f3n \u201cPari\u00f3 la luna\u201d con seguridad, respetando los cambios r\u00edtmicos, las din\u00e1micas y los cortes, integr\u00e1ndose muy bien con el grupo.", "porcentaje": 100.0, "clase": "Auralidad - Grupo B", "profesor": "Daniela Visbal"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "Se sugiere estudiar los ejercicos propuestos, con claridad en digitaci\u00f3n, ritmo, articulaci\u00f3n postura al tocar para fortalecer las bases tecnicas y el estudio desde un tempo lento de la obra popular enfocando y contolando la musicalidad a dos manos.", "porcentaje": 44.0, "clase": "Instrumento - Grupo B", "profesor": "Camilo Orozco"}], "nombre_oficial": "Sarah Angieline Carrillo Moncada", "instrumento_matriculado": "PIANO", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1096704162": {"nombre": "Alejandro Acevedo Silva", "programa": "Instrumental", "instrumento": "Instrumento - Grupo B", "profesor": "Daniela Visbal", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-05", "observacion": "Demuestra un : "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "Logr\u00f3 una ejecuci\u00f3n r\u00edtmica estable que ayud\u00f3 al acople general del grupo. Mostr\u00f3 disposici\u00f3n para experimentar con diferentes texturas. Se sugiere trabajar m\u00e1s en la precisi\u00f3n de los un\u00edsonos con los otros guitarristas.", "porcentaje": 52.0, "clase": "Auralidad - Grupo B", "profesor": "Andr\u00e9s Jaimes"}, {"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-06", "observacion": "", "porcentaje": 100.0, "clase": "CORO - Juvenil", "profesor": "Daniela Visbal"}], "nombre_oficial": "Thomas Santiago Amorocho Villabona", "instrumento_matriculado": "GUITARRA ELECTRICA", "programa_matriculado": "Instrumental Grupal del I al VIII (6 a\u00f1os en adelante)(ni\u00f1os, j\u00f3venes y adultos)"}, "1097505574": {"nombre": "Danna Gabriela Lozada Archila", "nombre_oficial": "Danna Gabriela Lozada Archila", "programa": "Instrumental", "programa_matriculado": "Instrumental Grupal", "instrumento": "Instrumento - Grupo B", "instrumento_matriculado": "Canto", "profesor": "G\u00e9nesis Moreno", "observaciones": [{"revision": "1\u00aa Revisi\u00f3n", "fecha": "2026-05-13", "observacion": "Alcances:\n-Letra correcta del repertorio asignado\n-Afinaci\u00f3n estable\n-Passaggios adecuados para cada registro\n-Pronunciaci\u00f3n y articulaci\u00f3n correcta\nAspectos a mejorar:\n-Proyecci\u00f3n y foco del sonido\n-Expresi\u00f3n\n-Agudos sin aire", "porcentaje": 60.0, "clase": "Instrumento - Grupo B", "profesor": "G\u00e9nesis Moreno"}]}}, "missing": {"1098825003": {"nombre": "Maria Lucia Vega Olarte", "programa": "Curso de m\u00fasica para la comunidad UIS", "instrumento": "VIOLIN"}, "1098082779": {"nombre": "Thiago Rivero Pinzon", "programa": "Preiniciaci\u00f3n musical (3- 4 a\u00f1os)", "instrumento": ""}, "1096539049": {"nombre": "Juan Pablo Toloza Diaz", "programa": "Curso de m\u00fasica para la comunidad UIS", "instrumento": "PIANO"}, "1098807285": {"nombre": "Juan Pabl function getPctColor(pct) {
  if (pct >= 85) return '#2d6a4f';
  if (pct >= 65) return '#52b788';
  return '#95d5b2';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buscar() {
  var doc = document.getElementById('docInput').value.trim().replace(/\s+/g,'');
  var err = document.getElementById('errorMsg');
  err.style.display = 'none';
  if (!doc) { err.textContent = 'Por favor ingresa tu número de documento.'; err.style.display = 'block'; return; }
  var student = DATA.students[doc];
  if (!student) { err.textContent = 'No se encontró ningún estudiante con ese número de documento. Verifica e intenta de nuevo.'; err.style.display = 'block'; return; }
  renderResult(doc, student);
}

function renderResult(doc, s) {
  var obs = s.observaciones || [];
  var nombre = s.nombre_oficial || s.nombre;
  var programa = s.programa_matriculado || s.programa || '';
  var instrumento = s.instrumento_matriculado || s.instrumento || '';

  var obsHTML = '';
  for (var i = 0; i < obs.length; i++) {
    var o = obs[i];
    var pct = o.porcentaje || 0;
    var color = getPctColor(pct);
    var fechaStr = '';
    if (o.fecha) {
      var parts = o.fecha.split('-');
      if (parts.length === 3) {
        var meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
        fechaStr = parseInt(parts[2],10) + ' de ' + meses[parseInt(parts[1],10)-1] + ' de ' + parts[0];
      }
    }
    var profesor = o.profesor || s.profesor || '';
    obsHTML += '<div class="obs-block">';
    obsHTML += '<div style="margin-bottom:10px">';
    obsHTML += '<span class="obs-revision-badge">&#128203; ' + escHtml(o.revision) + '</span>';
    if (o.clase && o.clase !== 'nan') obsHTML += '<span class="obs-clase">&#127932; ' + escHtml(o.clase) + '</span>';
    obsHTML += '</div>';
    if (fechaStr) obsHTML += '<div class="obs-date">&#128197; ' + fechaStr + '</div>';
    obsHTML += '<div class="obs-text">' + escHtml(o.observacion) + '</div>';
    obsHTML += '<div class="obs-pct-row"><span class="obs-pct-label">Avance:</span>';
    obsHTML += '<div class="obs-pct-bar-bg"><div class="obs-pct-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>';
    obsHTML += '<span class="obs-pct-num" style="color:' + color + '">' + pct + '%</span></div>';
    if (profesor) obsHTML += '<div class="obs-profesor">Prof. ' + escHtml(profesor) + '</div>';
    obsHTML += '</div>';
  }

  var html = '<div class="student-header">';
  html += '<span class="student-tag">Estudiante · ' + escHtml(doc) + '</span>';
  html += '<div class="student-name">' + escHtml(nombre) + '</div>';
  html += '<div class="student-meta">';
  if (programa) html += '<span class="meta-pill">&#128218; ' + escHtml(programa) + '</span>';
  if (instrumento && instrumento !== 'nan') html += '<span class="meta-pill">&#127928; ' + escHtml(instrumento) + '</span>';
  html += '</div></div>';
  html += '<div class="result-body">';
  html += '<div class="obs-section-title">Observaciones del profesor</div>';
  html += obsHTML || '<p style="color:var(--muted);font-size:14px;">No hay observaciones registradas aún.</p>';
  html += '</div>';

  document.getElementById('resultContent').innerHTML = html;
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('resultCard').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

function volver() {
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('loginCard').style.display = 'block';
  document.getElementById('docInput').value = '';
  document.getElementById('errorMsg').style.display = 'none';
}

document.getElementById('btnBuscar').addEventListener('click', buscar);
document.getElementById('btnVolver').addEventListener('click', volver);
document.getElementById('docInput').addEventListener('keydown', function(e) { if(e.key==='Enter') buscar(); });
</script>

</html>
